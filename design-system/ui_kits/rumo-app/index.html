<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0;background:var(--color-neutral-200)}
.phone{max-width:420px;margin:0 auto;min-height:100vh;background:var(--color-bg);position:relative;box-shadow:var(--shadow-lg)}
header{position:sticky;top:0;z-index:5;background:var(--color-surface);border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
</style></head>
<body>
<div id="root"></div>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="TripsScreen.jsx"></script>
<script type="text/babel" src="TripDetailScreen.jsx"></script>
<script type="text/babel" src="ExpensesScreen.jsx"></script>
<script type="text/babel" src="ItineraryScreen.jsx"></script>
<script type="text/babel" src="BudgetScreen.jsx"></script>
<script type="text/babel" src="PriceMonitorScreen.jsx"></script>
<script type="text/babel">
const TRIP = { id: 't1', name: 'Foz do Iguaçu + Paraguai + Argentina', destination: 'Foz/PY/AR/BUE', dates: '30/10 a 09/11', baseCurrency: 'BRL', members: ['Ana Costa', 'Pedro', 'João'] };
const EXPENSES = [
  { id: 1, description: 'Jantar churrascaria', category: 'alimentação', date: '24/10', paidBy: 'Ana Costa', amount: 180, currency: 'BRL', amountBase: 180 },
  { id: 2, description: 'Ingressos Cataratas AR', category: 'passeio', date: '25/10', paidBy: 'Pedro', amount: 45, currency: 'USD', amountBase: 243 },
  { id: 3, description: 'Táxi aeroporto', category: 'transporte', date: '26/10', paidBy: 'João', amount: 60, currency: 'BRL', amountBase: 60 },
];

function App() {
  const { BottomNav } = window.RumoDesignSystem_15b2c0;
  const [authed, setAuthed] = React.useState(false);
  const [screen, setScreen] = React.useState('trips');
  const [trips, setTrips] = React.useState([TRIP]);

  if (!authed) return <div className="phone"><window.LoginScreen onLogin={() => setAuthed(true)} /></div>;

  const NAV = [
    { value: 'trips', label: 'Viagens', icon: '🧭' },
    { value: 'expenses', label: 'Gastos', icon: '💰' },
    { value: 'itinerary', label: 'Roteiro', icon: '🗺️' },
    { value: 'budget', label: 'Orçamento', icon: '📊' },
    { value: 'monitor', label: 'Preços', icon: '✈️' },
  ];

  let body;
  if (screen === 'trips') body = <window.TripsScreen trips={trips} onOpen={() => setScreen('tripDetail')} />;
  else if (screen === 'tripDetail') body = <window.TripDetailScreen trip={TRIP} onBack={() => setScreen('trips')} onOpenExpenses={() => setScreen('expenses')} />;
  else if (screen === 'expenses') body = <window.ExpensesScreen trip={TRIP} expenses={EXPENSES} onBack={() => setScreen('tripDetail')} />;
  else if (screen === 'itinerary') body = <window.ItineraryScreen onBack={() => setScreen('trips')} />;
  else if (screen === 'budget') body = <window.BudgetScreen onBack={() => setScreen('trips')} />;
  else body = <window.PriceMonitorScreen onBack={() => setScreen('trips')} />;

  return (
    <div className="phone">
      <header>
        <span style={{ fontWeight: 800, color: 'var(--color-primary-700)', fontSize: 18 }}>Rumo</span>
        <a onClick={() => setAuthed(false)} style={{ fontSize: 13, color: 'var(--color-text-secondary)', cursor: 'pointer' }}>Sair</a>
      </header>
      {body}
      <BottomNav items={NAV} value={screen === 'tripDetail' ? 'trips' : screen} onChange={setScreen} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
