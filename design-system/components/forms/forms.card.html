<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--color-bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Button, Input, CurrencySelect } = window.RumoDesignSystem_15b2c0;
function Demo(){
  const [amount, setAmount] = React.useState('120,00');
  const [currency, setCurrency] = React.useState('USD');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:640}}>
      <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
        <Button variant="primary">Salvar gasto</Button>
        <Button variant="secondary">Cancelar</Button>
        <Button variant="ghost">+ mais opções</Button>
        <Button variant="danger">Excluir</Button>
        <Button variant="primary" disabled>Desabilitado</Button>
        <Button variant="primary" loading>Salvando</Button>
      </div>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
        <Input label="Valor" prefix="R$" size="lg" value={amount} onChange={e=>setAmount(e.target.value)} />
        <CurrencySelect label="Moeda" value={currency} onChange={e=>setCurrency(e.target.value)} />
      </div>
      <Input label="Nome da viagem" placeholder="Foz + Argentina" />
      <Input label="E-mail" error="E-mail inválido" value="pedro@" onChange={()=>{}} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
