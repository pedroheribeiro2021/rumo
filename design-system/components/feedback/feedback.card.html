<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--color-bg)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { StatusChip, ProgressBar, Modal, Button, EmptyState, LoadingState, ErrorState, OfflineBanner } = window.RumoDesignSystem_15b2c0;
function Demo(){
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:640}}>
      <div style={{display:'flex',gap:8}}>
        <StatusChip tone="good">no alvo</StatusChip><StatusChip tone="warn">perto</StatusChip><StatusChip tone="bad">acima</StatusChip><StatusChip tone="info">novo</StatusChip>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:8,maxWidth:280}}>
        <ProgressBar value={65} max={100} tone="brand" />
        <ProgressBar value={92} max={100} tone="warn" />
        <ProgressBar value={110} max={100} tone="bad" />
      </div>
      <OfflineBanner pendingCount={2} />
      <ErrorState onRetry={()=>{}} />
      <LoadingState rows={2} />
      <EmptyState icon="🧭" title="Nenhuma viagem ainda" message="Crie a primeira acima." action={<Button onClick={()=>setOpen(true)}>+ Nova viagem</Button>} />
      <Modal open={open} onClose={()=>setOpen(false)} title="Nova viagem" footer={<Button fullWidth>Criar viagem</Button>}>
        <p style={{color:'var(--color-text-secondary)',fontSize:14}}>Formulário de exemplo dentro do bottom-sheet.</p>
      </Modal>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body></html>
